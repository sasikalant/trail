<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strawberry Counter</title>

  <style>
    body {
      margin: 0;
      padding: 40px 16px;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #382326;
      background: #fff5f6;
    }

    h1 {
      color: #a31e3b;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .tabs button {
      padding: 12px 24px;
      border: 1px solid #a31e3b;
      border-radius: 8px;
      background: white;
      color: #a31e3b;
      font: inherit;
      cursor: pointer;
    }

    .tabs button[aria-pressed="true"] {
      background: #a31e3b;
      color: white;
    }

    .panel {
      max-width: 480px;
      margin: 20px auto;
      padding: 24px;
      border-radius: 12px;
      background: white;
    }
  </style>
</head>
<body>
  <h1>Strawberry Counter</h1>

  <div class="tabs" role="group" aria-label="Choose a model">
    <button type="button" aria-controls="model1" aria-pressed="true">
      Model 1
    </button>
    <button type="button" aria-controls="model2" aria-pressed="false">
      Model 2
    </button>
  </div>

  <section class="panel" id="model1">
    <h2>Model 1</h2>
    <p>Model 1 controls will go here.</p>
  </section>

  <section class="panel" id="model2" hidden>
    <h2>Model 2</h2>
    <p>Model 2 controls will go here.</p>
  </section>

  <script>
    const modelButtons = document.querySelectorAll(".tabs button");

    modelButtons.forEach((button) => {
      button.addEventListener("click", () => {
        modelButtons.forEach((modelButton) => {
          const isSelected = modelButton === button;
          const panelId = modelButton.getAttribute("aria-controls");

          modelButton.setAttribute("aria-pressed", String(isSelected));
          document.getElementById(panelId).hidden = !isSelected;
        });
      });
    });
  </script>
</body>
</html>
